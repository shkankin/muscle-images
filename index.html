<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>M.U.S.C.L.E. Collector</title>
  <meta name="description" content="Track your collection of the 236 M.U.S.C.L.E. figures — the US release of Kinnikuman's Kinkeshi. Fill in the star as you catch each one.">
  <link rel="canonical" href="https://musclemen.app/">
  <meta name="theme-color" content="#633159">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Social / link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="M.U.S.C.L.E. Collector">
  <meta property="og:title" content="M.U.S.C.L.E. Collector">
  <meta property="og:description" content="Track all 236 M.U.S.C.L.E. figures — owned, color variants, and what's left to find.">
  <meta property="og:url" content="https://musclemen.app/">
  <meta property="og:image" content="https://musclemen.app/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="M.U.S.C.L.E. Collector">
  <meta name="twitter:description" content="Track all 236 M.U.S.C.L.E. figures — owned, color variants, and what's left to find.">
  <meta name="twitter:image" content="https://musclemen.app/images/og-image.png">

  <!-- Content Security Policy. No inline scripts (script-src 'self') — the
       renderer sets inline style attributes for figure colors, so style-src
       allows those. Figure art loads from the companion images repo. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https://raw.githubusercontent.com;
    font-src 'self';
    connect-src 'self' https://raw.githubusercontent.com;
    manifest-src 'self';
    base-uri 'none';
    form-action 'none';">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="images/icon-192.png">

  <link rel="preload" href="fonts/anton-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="v-poster">

  <div class="field" id="field" aria-hidden="true"></div>
  <div class="bursts" id="bursts" aria-hidden="true"></div>

  <button class="gear" id="gear" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H22a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>
  </button>

  <div class="wrap">
    <header class="masthead">
      <img src="https://raw.githubusercontent.com/shkankin/muscle-images/main/images/muscle_burst.png" alt="M.U.S.C.L.E.">
    </header>
    <section class="view on" id="v-poster"><div class="sheet"><div class="grid" id="grid"></div></div></section>
    <section class="view" id="v-list">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search # or name..." aria-label="Search figures">
        <button class="fbtn" id="filterBtn">Filters</button>
      </div>
      <div class="count" id="listCount"></div>
      <div id="rows"></div>
    </section>
    <section class="view stats" id="v-stats"></section>
  </div>

  <div class="progress" id="progress">
    <b id="pCount">0</b><div class="bar"><i id="pBar" style="width:0%"></i></div>
    <small id="pText">of 236</small>
  </div>

  <nav class="nav" id="nav">
    <button data-view="poster" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>POSTER</span></button>
    <button data-view="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/></svg>
      <span>LIST</span></button>
    <button data-view="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 20V10M12 20V4M18 20v-6"/></svg>
      <span>STATS</span></button>
  </nav>

  <div class="toast" id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
